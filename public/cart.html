<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Cart - ShopEasy</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <nav class="navbar">
    <div class="logo">ShopEasy</div>
    <div class="nav-links">
      <a href="index.html">Home</a>
      <a href="login.html">Login</a>
      <a href="cart.html" class="cart-btn">Cart (<span id="cart-count">0</span>)</a>
    </div>
  </nav>

  <div class="cart-container">
    <h1>Your Cart</h1>
    <div id="cart-items">
      <!-- Cart items loaded by JS -->
    </div>

    <div class="cart-total">
      <h2>Total: ₹<span id="cart-total-amount">0</span></h2>
      <button class="btn-checkout" onclick="checkout()">Proceed to Checkout</button>
    </div>
  </div>

  <script src="cart.js"></script>
  <script>
    renderCart();

    function checkout() {
      const user = localStorage.getItem("loggedInUser");
      if (!user) {
        alert("Please login to place an order!");
        window.location.href = "login.html";
        return;
      }
      alert("Order placed successfully! Thank you for shopping with us.");
      localStorage.removeItem("cart");
      renderCart();
    }
  </script>
</body>
</html>
