<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login - ShopEasy</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <nav class="navbar">
    <div class="logo">ShopEasy</div>
    <div class="nav-links">
      <a href="index.html">Home</a>
      <a href="cart.html" class="cart-btn">Cart (<span id="cart-count">0</span>)</a>
    </div>
  </nav>

  <div class="auth-container">

    <!-- LOGIN FORM -->
    <div class="auth-box" id="login-box">
      <h2>Welcome back</h2>
      <p>Login to your ShopEasy account</p>
      <div id="login-msg" class="msg"></div>

      <div class="form-group">
        <label>Email</label>
        <input type="email" id="login-email" placeholder="you@email.com" />
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="login-pass" placeholder="Enter password" />
      </div>
      <button class="btn-submit" onclick="login()">Login</button>
      <p class="auth-switch">No account? <a href="#" onclick="showRegister()">Register here</a></p>
    </div>

    <!-- REGISTER FORM -->
    <div class="auth-box" id="register-box" style="display:none">
      <h2>Create account</h2>
      <p>Join ShopEasy today</p>
      <div id="reg-msg" class="msg"></div>

      <div class="form-group">
        <label>Full Name</label>
        <input type="text" id="reg-name" placeholder="Your name" />
      </div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="reg-email" placeholder="you@email.com" />
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="reg-pass" placeholder="Create password" />
      </div>
      <button class="btn-submit" onclick="register()">Register</button>
      <p class="auth-switch">Already have an account? <a href="#" onclick="showLogin()">Login</a></p>
    </div>

  </div>

  <script src="cart.js"></script>
  <script>
    function showRegister() {
      document.getElementById("login-box").style.display = "none";
      document.getElementById("register-box").style.display = "block";
    }
    function showLogin() {
      document.getElementById("register-box").style.display = "none";
      document.getElementById("login-box").style.display = "block";
    }

    function register() {
      const name  = document.getElementById("reg-name").value.trim();
      const email = document.getElementById("reg-email").value.trim();
      const pass  = document.getElementById("reg-pass").value;
      const msg   = document.getElementById("reg-msg");

      if (!name || !email || !pass) {
        msg.className = "msg error";
        msg.textContent = "Please fill all fields.";
        return;
      }

      // Save user to localStorage (simple demo - real app uses a database)
      const users = JSON.parse(localStorage.getItem("users")) || [];
      if (users.find(u => u.email === email)) {
        msg.className = "msg error";
        msg.textContent = "Email already registered.";
        return;
      }

      users.push({ name, email, pass });
      localStorage.setItem("users", JSON.stringify(users));
      msg.className = "msg success";
      msg.textContent = "Account created! You can now login.";
      setTimeout(showLogin, 1500);
    }

    function login() {
      const email = document.getElementById("login-email").value.trim();
      const pass  = document.getElementById("login-pass").value;
      const msg   = document.getElementById("login-msg");

      const users = JSON.parse(localStorage.getItem("users")) || [];
      const user  = users.find(u => u.email === email && u.pass === pass);

      if (!user) {
        msg.className = "msg error";
        msg.textContent = "Wrong email or password.";
        return;
      }

      localStorage.setItem("loggedInUser", user.name);
      msg.className = "msg success";
      msg.textContent = `Welcome back, ${user.name}!`;
      setTimeout(() => window.location.href = "index.html", 1200);
    }

    updateCartCount();
  </script>
</body>
</html>
